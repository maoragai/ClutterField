# Legacy prototype scripts (dataset.py, hash_encoding.py, model.py, train.py,
# utils.py) predate this skeleton and are excluded until migrated into the
# clutterfield package.
exclude: "^(dataset|hash_encoding|model|train|utils)\\.py$"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
